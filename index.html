<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Globo 3D – Luoghi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Globo 3D</div>
    <div class="hint">Trascina per ruotare • Rotellina/pinch per zoom</div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Luoghi</h2>
      <div class="controls">
        <input id="search" type="search" placeholder="Cerca luogo…" />
        <button id="reset">Reset vista</button>
      </div>
      <ul id="places" class="places"></ul>
      <p class="note">Clicca un luogo: il globo ruota e lo centra.</p>
    </section>

    <section class="stage">
      <canvas id="c"></canvas>
      <div id="loading" class="loading">Caricamento…</div>
    </section>
  </main>

  <footer class="footer">
    WebGL / Three.js • Pubblicabile su GitHub Pages
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
